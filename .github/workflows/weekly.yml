name: Inspect Weekly subscriber connection
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only test mode
        required: true
        default: inspect
        type: choice
        options:
          - peek
          - inspect
permissions:
  contents: read
concurrency:
  group: weekly-subscriber-sync
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Read queue count only
        id: queue
        env:
          WEEKLY_QUEUE_KEY: ${{ secrets.WEEKLY_QUEUE_KEY }}
        run: node automation/sync-weekly.mjs --peek
      - name: Inspect publisher access and Weekly defaults without adding subscribers
        if: inputs.mode == 'inspect'
        env:
          WEEKLY_QUEUE_KEY: ${{ secrets.WEEKLY_QUEUE_KEY }}
          SUBSTACK_SESSION: ${{ secrets.SUBSTACK_SESSION }}
          SUBSTACK_PROBE_EMAIL: ${{ secrets.SUBSTACK_PROBE_EMAIL }}
        run: node automation/sync-weekly.mjs --inspect
